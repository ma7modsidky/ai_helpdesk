[project]
name = "resolveai-helpdesk"
version = "0.1.0"
description = "Multi-tenant AI-assisted helpdesk backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-django>=4.9,<5",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are generated by Django; formatting or import-sorting them would
# produce diffs Django immediately rewrites.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = [
    # Test-only asserts and hardcoded test secrets are expected in tests.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S603"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["apps", "tests"]
addopts = "-ra --strict-markers --strict-config"
