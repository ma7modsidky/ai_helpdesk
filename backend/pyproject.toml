[project]
name = "resolveai-helpdesk"
version = "0.1.0"
description = "Multi-tenant AI-assisted helpdesk backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6",
    "djangorestframework-stubs>=3.15,<4",
    "factory-boy>=3.3,<4",
    "mypy>=1.11,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "pytest-django>=4.9,<5",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are generated by Django; formatting or import-sorting them would
# produce diffs Django immediately rewrites.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = [
    # Test-only asserts and hardcoded test secrets are expected in tests.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S603"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["apps", "tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["migrations/", "\\.venv/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
# factory_boy ships no type information and its metaclasses defeat inference.
module = ["factory", "factory.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
# Behaviour lives in the apps; configuration modules are declarative and the
# production ones are imported only in subprocesses, so measuring them would
# report a failure that no test could ever fix.
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured at 97% when this floor was set. The gap is deliberate: one untested
# error branch should not fail the build, but a real drop must.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
