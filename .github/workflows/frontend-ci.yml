name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package manager version comes from `packageManager` in package.json, so the
      # job installs exactly what a developer does rather than tracking it twice.
      - name: Activate the pinned package manager
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable pnpm
          pnpm --version

      # A drift between package.json and the lockfile has to fail here rather than be
      # resolved silently, which is why --frozen-lockfile is not optional.
      - name: Install dependencies from lock file
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # The coverage floors are configured in vite.config.ts and vitest exits non-zero
      # when one is missed, so this step is the gate as well as the report.
      - name: Component and internationalization tests
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      # T4.11: the budget is part of the gate, and the measured sizes are printed whether
      # it passes or fails so a reviewer can see what the change cost.
      - name: Bundle budget
        run: pnpm check:bundle

  e2e:
    name: End-to-end journey, both directions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway credentials for this job only, exactly like the backend job: the journey
    # creates its own account, workspace, ticket, and invitations inside the job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resolveai
          POSTGRES_USER: resolveai
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveai -d resolveai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite registers an account per direction on every run, so it runs against the
      # settings module that raises the client throttles for it (12_CI_CD §pull request
      # pipeline step 8). Throttling itself is asserted by the backend tests.
      DJANGO_SETTINGS_MODULE: config.settings.e2e
      POSTGRES_DB: resolveai
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate the pinned package manager
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable pnpm
          pnpm --version

      - name: Install frontend dependencies from lock file
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies from lock file
        working-directory: backend
        run: uv sync --locked

      # The journey needs the schema to exist before the API starts serving it; the seed
      # step in the suite's global setup then creates the workspace it reads through the
      # public contract rather than a fixture file.
      - name: Apply migrations
        working-directory: backend
        run: uv run --no-sync python manage.py migrate --noinput

      # Started in this step and used by the steps after it, which is why it is not
      # waited on: readiness is asserted here and again by the suite's global setup.
      - name: Start the API
        working-directory: backend
        run: |
          nohup uv run --no-sync python manage.py runserver 127.0.0.1:8000 --noreload &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health/ready/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/ready/ > /dev/null

      - name: Install the browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # The Vite dev server is started by Playwright's webServer, and the browser reaches
      # the API through the same-origin proxy exactly as development and deployment do.
      - name: Journey in both directions against the seeded backend
        working-directory: frontend
        run: pnpm e2e

      # A failing journey is only diagnosable from its trace, so the report and traces are
      # kept when the run fails and skipped when it passes.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 7
