<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ResolveAI Helpdesk</title>
    <script>
      // Runs before the bundle so the first paint already has the right colour scheme
      // and text direction. The same resolution rules live in src/i18n/locale.ts and
      // src/theme; the unit tests cover those, and this copy exists only to avoid a
      // flash of the wrong theme or a left-to-right layout for an Arabic user.
      (function () {
        try {
          var root = document.documentElement;
          var storedMode = window.localStorage.getItem('mui-mode');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var scheme =
            storedMode === 'light' || storedMode === 'dark'
              ? storedMode
              : prefersDark
                ? 'dark'
                : 'light';
          root.setAttribute('data-mui-color-scheme', scheme);
          root.style.colorScheme = scheme;

          var supported = ['en', 'ar'];
          var locale = window.localStorage.getItem('resolveai.locale');
          if (supported.indexOf(locale) === -1) {
            locale = new URLSearchParams(window.location.search).get('lang');
          }
          if (supported.indexOf(locale) === -1) {
            var tags = navigator.languages || [navigator.language];
            for (var i = 0; i < tags.length; i += 1) {
              var base = String(tags[i]).toLowerCase().split('-')[0];
              if (supported.indexOf(base) !== -1) {
                locale = base;
                break;
              }
            }
          }
          if (supported.indexOf(locale) !== -1) {
            root.lang = locale;
            root.dir = locale === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (error) {
          // Storage or matchMedia unavailable: the app resolves both again on mount.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
